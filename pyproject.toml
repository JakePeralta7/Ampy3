[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ampy3"
version = "0.1.34"
description = "Sync playlists from YouTube Music (and other sources) to Plex using MusicBrainz metadata IDs"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "celery[redis]>=5.7.0",
    "pydantic-settings>=2.16.2",
    "ytmusicapi>=1.12.3",
    "apscheduler>=4.0.0a6,<5.0.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "sniffio>=1.3",
    "valkey>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "python-json-logger>=4.2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "aiosqlite>=0.22.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "pymdown-extensions>=12.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
lint.ignore = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "celery",
    "apscheduler.*",
    "apscheduler",
    "celery.result",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
