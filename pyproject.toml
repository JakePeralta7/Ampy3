[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ampy3"
version = "0.1.0"
description = "Sync playlists from YouTube Music (and other sources) to Plex using MusicBrainz metadata IDs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "celery[redis]>=5.4.0",
    "pydantic-settings>=2.6.0",
    "yt-dlp>=2025.1.26",
    "plexapi>=4.0.0",
    "ytmusicapi>=1.7.0",
    "apscheduler>=3.10.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "valkey>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
lint.ignore = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "celery",
    "apscheduler.*",
    "apscheduler",
    "celery.result",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
