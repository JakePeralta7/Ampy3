[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ampy3"
version = "0.1.0"
description = "Sync playlists from YouTube Music (and other sources) to Plex using MusicBrainz metadata IDs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "celery[redis]>=5.6.3",
    "pydantic-settings>=2.15.0",
    "yt-dlp>=2026.8.19",
    "plexapi>=4.18.2",
    "ytmusicapi>=1.12.2",
    "apscheduler>=3.11.3",
    "click>=8.5.0",
    "httpx>=0.28.1",
    "valkey>=6.1.1",
    "sqlalchemy>=2.0.52",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
lint.ignore = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "celery",
    "apscheduler.*",
    "apscheduler",
    "celery.result",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
