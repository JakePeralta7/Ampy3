name: "Quick Start"
description: >
  Search-then-match pipeline with MusicBrainz ID fast-path.
  First tries exact MBID matching (if both source and target have MBIDs),
  then falls back to fuzzy title+artist matching with 0.75 threshold.

nodes:
  source:
    type: track_source

  search:
    type: search
    config:
      fields:
        - search_title
        - search_artist
        - search_album
      max_results: 50

  match:
    type: match_composite
    config:
      strategies:
        - type: mbid
          field: mbid
        - type: fuzzy
          title_threshold: 0.75
          title_weight: 0.6
          artist_weight: 0.4
        - type: album
          strategy: exact
      require_all: false

  output:
    type: match_output

edges:
  - from: source
    to: search

  - from: search
    to: match
    source_handle: out
    target_handle: candidates

  - from: match
    to: output