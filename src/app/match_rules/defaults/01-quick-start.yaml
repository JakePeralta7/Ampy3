name: "Quick Start"
description: >
  Search-then-compare pipeline with MusicBrainz ID fast-path.
  First tries exact MBID matching (if both source and target have MBIDs),
  then falls back to text-based search+compare with 0.75 weighted threshold.

nodes:
  source:
    type: track_source

  search:
    type: search
    config:
      fields_to_search:
        - search_title
        - search_artist
        - search_album
      max_results: 50

  mbid_compare:
    type: mbid_compare
    config:
      field: mbid

  compare:
    type: compare
    config:
      fields_to_match:
        - title
        - artist_name
        - album_name
      threshold: 0.75
      weights:
        title: 50
        artist_name: 25
        album_name: 25

  output:
    type: match_output

edges:
  - from: source
    to: search

  - from: search
    to: mbid_compare
    source_handle: out
    target_handle: candidates

  - from: mbid_compare
    to: output

  - from: search
    to: compare
    source_handle: out
    target_handle: candidates

  - from: compare
    to: output
