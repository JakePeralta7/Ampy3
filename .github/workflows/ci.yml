name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format check
        run: ruff format --check src/

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "12.4.2"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm run lint

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ampy3
          POSTGRES_PASSWORD: ampy3
          POSTGRES_DB: ampy3
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest --tb=short -q
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ampy3:ampy3@localhost:5432/ampy3
          # The startup gate is fail-closed: APP_ENV defaults to "production"
          # and requires a SECRET_KEY of >= 32 characters.
          SECRET_KEY: ci-test-secret-key-0123456789abcdef

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web target
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker target
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — verify images build and web container reports ready
        run: |
          docker compose up -d postgres valkey
          docker compose up -d web
          sleep 20
          # Readiness requires a reachable database, so a 200 /health/ready
          # proves the full API + migrations + DB stack works end to end.
          curl -fsS http://localhost:8000/health/ready
          docker compose ps --status running | grep web
          docker compose down
        env:
          POSTGRES_PASSWORD: ci-smoke-test-password-123
          SECRET_KEY: ci-smoke-secret-key-0123456789abcdef
