services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=ampy3
      - POSTGRES_INITDB_ARGS=-c max_connections=200 -c password_encryption=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 10s
      retries: 5

  web:
    image: ghcr.io/jakeperalta7/ampy3-web:latest
    build:
      context: .
      target: web
    ports:
      - ${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      retries: 3
      start_period: 15s
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}

  worker:
    image: ghcr.io/jakeperalta7/ampy3-worker:latest
    build:
      context: .
      target: worker
    entrypoint: ["docker/worker-entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    command: valkey-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
