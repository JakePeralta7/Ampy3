services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=ampy3
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=ampy3
      - POSTGRES_INITDB_ARGS=-c max_connections=200 -c password_encryption=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampy3"]
      interval: 10s
      retries: 5

  web:
    image: ghcr.io/jakeperalta7/ampy3-web:latest
    build:
      context: .
      target: web
    ports:
      - ${APP_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 3
      start_period: 15s
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ampy3:${POSTGRES_PASSWORD}@postgres:5432/ampy3
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - SECRET_KEY=${SECRET_KEY:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-168}

  worker:
    image: ghcr.io/jakeperalta7/ampy3-worker:latest
    build:
      context: .
      target: worker
    command: sh -c "celery -A app.worker.app worker --loglevel=${CELERY_LOG_LEVEL:-info} --concurrency=${CELERY_WORKER_CONCURRENCY:-1}"
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ampy3:${POSTGRES_PASSWORD}@postgres:5432/ampy3
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-1}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL:-info}

  valkey:
    image: valkey/valkey:latest
    command: valkey-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
